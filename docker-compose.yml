# ============================================================
# RootL Atlas — Docker Compose
# ============================================================
# Serviços: PostgreSQL/PostGIS, MinIO, API FastAPI,
#           Frontend Vite, Prefect Server + Worker
# ============================================================

name: rootl-atlas

networks:
  atlas-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prefect_data:
  lakehouse_data:

services:
  # ─────────────────────────────────────────────────────────
  # PostgreSQL 16 + PostGIS 3.4 + H3-pg
  # ─────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rootl_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./infra/postgres/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
    ports:
      - "5432:5432"
    networks:
      - atlas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-rootl_atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries='pg_stat_statements'
        -c pg_stat_statements.track=all
        -c max_connections=200
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c maintenance_work_mem=128MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c work_mem=8MB

  # ─────────────────────────────────────────────────────────
  # MinIO — Lakehouse de Objetos (S3-compatible)
  # ─────────────────────────────────────────────────────────
  minio:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    container_name: atlas-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-atlasadmin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-atlasadmin}}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console Web
    networks:
      - atlas-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Inicializa buckets do MinIO
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-13T00-00-00Z
    container_name: atlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - atlas-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-atlasadmin}} ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-atlasadmin}};
        mc mb --ignore-existing local/atlas-bronze;
        mc mb --ignore-existing local/atlas-silver;
        mc mb --ignore-existing local/atlas-gold;
        mc anonymous set public local/atlas-gold;
        echo 'Buckets inicializados.';
      "
    restart: on-failure

  # ─────────────────────────────────────────────────────────
  # Prefect Server — Orquestrador de Pipelines
  # ─────────────────────────────────────────────────────────
  prefect:
    image: prefecthq/prefect:3-python3.11
    container_name: atlas-prefect
    restart: unless-stopped
    environment:
      PREFECT_UI_URL: http://localhost:4200
      PREFECT_API_URL: http://0.0.0.0:4200/api
      PREFECT_SERVER_API_HOST: 0.0.0.0
    volumes:
      - prefect_data:/root/.prefect
    ports:
      - "4200:4200"
    networks:
      - atlas-net
    command: prefect server start
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prefect Worker
  prefect-worker:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: atlas-prefect-worker
    restart: unless-stopped
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-rootl_atlas}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-atlasadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-atlasadmin}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-atlasadmin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-atlasadmin}}
      LAKEHOUSE_PATH: /data
    volumes:
      - lakehouse_data:/data
      - ./pipeline:/app
    depends_on:
      postgres:
        condition: service_healthy
      prefect:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - atlas-net
    command: >
      sh -c "
        prefect worker start --pool 'default-agent-pool' --type process &
        python /app/flows/main_pipeline.py --register-only;
        wait
      "

  # Execução manual/avulsa do Pipeline (usado pelo Makefile)
  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-rootl_atlas}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-atlasadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-atlasadmin}}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-atlasadmin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY:-atlasadmin}}
      LAKEHOUSE_PATH: /data
    volumes:
      - lakehouse_data:/data
      - ./pipeline:/app
    depends_on:
      postgres:
        condition: service_healthy
      prefect:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - atlas-net

  # ─────────────────────────────────────────────────────────
  # API FastAPI
  # ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: atlas-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-123456}@postgres:5432/${POSTGRES_DB:-rootl_atlas}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atlas-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────────
  # Frontend Vue 3
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: atlas-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - atlas-net
