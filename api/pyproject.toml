[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootl-atlas-api"
version = "0.1.0"
description = "RootL Atlas — API FastAPI com suporte a MVT e GeoJSON"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "orjson>=3.10.9",        # JSON ultra-rápido
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
