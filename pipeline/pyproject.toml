[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rootl-atlas-pipeline"
version = "0.1.0"
description = "RootL Atlas — Pipeline de Engenharia de Dados Geoespaciais"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Dados geoespaciais
    "geopandas>=1.0.1",
    "pyogrio>=0.9.0",           # Backend rápido para I/O de formatos vetoriais
    "pyarrow>=17.0.0",          # Parquet / GeoParquet
    "shapely>=2.0.6",
    "fiona>=1.10.0",
    "rasterio>=1.3.11",         # Leitura de COG (MapBiomas)
    "pyproj>=3.7.0",            # Reprojeções
    
    # Processamento analítico
    "duckdb>=1.1.0",
    "duckdb-engine>=0.13.0",
    
    # HTTP e download
    "httpx[http2]>=0.27.0",
    "aiohttp>=3.10.0",
    "boto3>=1.35.0",            # MinIO (S3-compat)
    "tqdm>=4.67.0",
    
    # DATASUS / DBC
    "pysus>=0.12.0",
    
    # OSM
    "osmium>=3.7.0",            # pyosmium para processamento PBF
    
    # Validação de esquemas
    "pandera[geopandas]>=0.20.0",
    
    # Orquestração
    "prefect>=2.20.0",
    "prefect-sqlalchemy>=0.4.0",
    
    # Banco de dados
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.35",
    
    # Utilitários
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "tenacity>=9.0.0",          # Retry com backoff
    "rich>=13.9.0",             # Saída formatada no terminal
    "typer>=0.12.5",            # CLI
    "hashlib-compat>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "hypothesis>=6.115.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"
